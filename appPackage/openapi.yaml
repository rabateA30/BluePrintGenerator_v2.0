openapi: 3.0.0
info:
  title: Blueprint Generator API
  description: API per la generazione automatica di documenti Blueprint Enel-GICT da materiali di progetto su SharePoint.
  version: 1.0.0

servers:
  - url: ${{BLUEPRINT_API_BASE_URL}}
    description: Azure Function App — Blueprint Generator

paths:
  /api/generate:
    post:
      operationId: generateBlueprint
      summary: Avvia la generazione di un documento Blueprint
      description: >
        Analizza i file nella cartella SharePoint indicata (PPTX, PDF, DOCX),
        sintetizza i contenuti utilizzando AI, compila il template Blueprint 1.4
        e genera il documento .docx finale. L'operazione è asincrona — usa
        checkBlueprintStatus per monitorare il completamento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_folder
                - project_name
              properties:
                source_folder:
                  type: string
                  description: Nome della cartella SharePoint contenente i materiali del progetto
                  example: "Global - CMR Virtual Assistant"
                project_name:
                  type: string
                  description: Nome del progetto (usato per il nome del file output)
                  example: "CMR Virtual Assistant"
                output_language:
                  type: string
                  enum: [Italian, English, Spanish]
                  default: English
                  description: Lingua di output del documento Blueprint
                output_filename:
                  type: string
                  description: Nome personalizzato del file di output (opzionale)
                  example: "Blueprint_CMR_v1.0.docx"
      responses:
        '202':
          description: Job di generazione avviato con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    description: ID univoco del job per il monitoraggio
                    example: "a1b2c3d4"
                  status:
                    type: string
                    example: "started"
                  message:
                    type: string
                    example: "Blueprint generation started. Use job_id to monitor progress."
                  poll_url:
                    type: string
                    example: "/api/status/a1b2c3d4"
        '400':
          description: Parametri mancanti o non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cartella non autorizzata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/status/{job_id}:
    get:
      operationId: checkBlueprintStatus
      summary: Controlla lo stato di un job di generazione Blueprint
      description: Restituisce lo stato corrente del job. Quando status è 'done', include il link al file generato.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: ID del job restituito da generateBlueprint
          example: "a1b2c3d4"
      responses:
        '200':
          description: Stato del job
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    enum: [running, done, error]
                    description: "running = in corso, done = completato, error = errore"
                  started_at:
                    type: string
                    format: date-time
                  finished_at:
                    type: string
                    format: date-time
                    nullable: true
                  output_url:
                    type: string
                    description: Link SharePoint al documento Blueprint generato (solo se status = done)
                    nullable: true
                  sections_filled:
                    type: integer
                    description: Numero di sezioni compilate (solo se status = done)
                    nullable: true
                  open_questions:
                    type: array
                    description: Sezioni non compilabili per mancanza di dati (solo se status = done)
                    items:
                      type: string
                    nullable: true
                  error:
                    type: string
                    description: Messaggio di errore (solo se status = error)
                    nullable: true
        '404':
          description: Job non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects:
    get:
      operationId: listProjects
      summary: Elenca i progetti disponibili per la generazione Blueprint
      description: Restituisce la lista delle cartelle SharePoint disponibili con i materiali di progetto.
      responses:
        '200':
          description: Lista dei progetti disponibili
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Nome della cartella/progetto
                          example: "Global - CMR Virtual Assistant"
                        file_count:
                          type: integer
                          description: Numero di file disponibili nella cartella
                          example: 5
                        file_types:
                          type: string
                          description: Tipi di file presenti
                          example: "PPTX, PDF, DOCX"

  /api/section/{job_id}:
    post:
      operationId: regenerateSection
      summary: Rigenera una singola sezione di un Blueprint completato
      description: >
        Riavvia la generazione di una sezione specifica di un Blueprint già completato.
        Utile quando una sezione ha prodotto un output insoddisfacente, è stata marcata
        come open question, o ha restituito un errore parziale. Il job_id deve riferirsi
        a un job nello stato 'done' o 'error'.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: ID del job Blueprint precedentemente completato
          example: "a1b2c3d4"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - section_id
              properties:
                section_id:
                  type: string
                  description: Identificatore della sezione da rigenerare.
                  enum:
                    - roles
                    - sistemi_asis
                    - process_cards_asis
                    - sequence_asis_1
                    - sequence_asis_2
                    - data_mapping
                    - architettura_funzionale
                    - sequence_tobe_1
                    - sequence_tobe_2
                    - sequence_tobe_3
                    - roadmap
                    - kpi_quantitativi
                    - kpi_qualitativi
                  example: "kpi_quantitativi"
      responses:
        '202':
          description: Rigenerazione sezione avviata
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  section_id:
                    type: string
                  status:
                    type: string
                    example: "regenerating"
        '400':
          description: section_id non valido o mancante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/log/{job_id}:
    get:
      operationId: getJobLog
      summary: Recupera il log di esecuzione di un job Blueprint
      description: >
        Restituisce il log di esecuzione completo del job indicato.
        Utile per diagnosticare errori, verificare i file elaborati e
        i passi eseguiti durante la generazione.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          description: ID del job di cui recuperare i log
          example: "a1b2c3d4"
      responses:
        '200':
          description: Log del job
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  started_at:
                    type: string
                    format: date-time
                  finished_at:
                    type: string
                    format: date-time
                    nullable: true
                  steps:
                    type: array
                    description: Lista ordinata dei passi di esecuzione con esito
                    items:
                      type: object
                      properties:
                        step:
                          type: string
                          example: "extract_pptx"
                        status:
                          type: string
                          enum: [ok, warning, error]
                        message:
                          type: string
                          example: "Estratti 12 slide da CMR_Overview.pptx"
                        timestamp:
                          type: string
                          format: date-time
        '404':
          description: Job non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Descrizione dell'errore
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - ApiKeyAuth: []
