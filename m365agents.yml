# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.11/yaml.schema.json
# Blueprint Generator — Declarative Agent for M365 Copilot
version: v1.11

environmentFolderPath: ./env

# ── PROVISION ──────────────────────────────────────────────────────────────────
provision:
  # Crea l'app nel Developer Portal
  - uses: teamsApp/create
    with:
      name: BlueprintGenerator${{APP_NAME_SUFFIX}}
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  # Registra l'API key nel vault di Copilot (per il plugin)
  - uses: apiKey/register
    with:
      name: blueprint-api-key
      appId: ${{TEAMS_APP_ID}}
      primaryClientSecret: ${{BLUEPRINT_API_KEY}}
      applicableToApps: MicrosoftTeams
      targetAudience: HomeTenant
    writeToEnvironmentFile:
      registrationId: BLUEPRINT_API_KEY_REFERENCE_ID

  # Build del pacchetto app con le variabili env correnti
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  # Validazione del pacchetto
  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  # Aggiorna l'app nel Developer Portal
  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  # Estende l'app a M365 (Teams + Outlook + Microsoft365 app)
  - uses: teamsApp/extendToM365
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID

# ── PUBLISH (per distribuire all'organizzazione) ───────────────────────────────
publish:
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/publishAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      publishedAppId: TEAMS_APP_PUBLISHED_APP_ID
